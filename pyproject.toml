[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-rag"
version = "0.3.0"
description = "Production-ready RAG: hybrid search (BM25 + vectors), LLM reranking, cited answers with guardrails, multi-tenant FastAPI + Qdrant, LangGraph, LangSmith evals"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["rag", "retrieval-augmented-generation", "llm", "langchain", "langgraph", "qdrant", "fastapi", "hybrid-search", "bm25", "reranking", "semantic-search"]
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-text-splitters>=0.3",
  "langchain-openai>=0.2",
  "qdrant-client>=1.12",
  "langgraph>=0.2",
  "langsmith>=0.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.5",
  "pypdf>=5",
  "redis>=5",
  "prometheus-client>=0.20",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",  # config.export_sdk_env (also pulled by uvicorn[standard])
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "fakeredis>=2.26"]
rerank = ["sentence-transformers>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # tests import shared helpers from tests.conftest

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501", "B905", "B007"]  # B008: FastAPI Depends()/File() idiom; rest: style only
